name = "myna"
version = "0.1.0"
keywords = ["math"]
license = "Apache-2.0"
defaultTargets = ["Myna"]
testDriver = "MynaTest"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.0"

[[lean_lib]]
name = "Myna"

[[lean_lib]]
name = "MynaTest"
globs = ["MynaTest.+"]
